name: Cadence unit tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv sync

      - name: Connector tests (no CertHub)
        run: uv run pytest tests -q

      - name: Lint hand-written Python
        run: uvx ruff check certhub/certhub_connector scripts tests src
