name: Offline tests (no CertHub)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install package
        run: uv sync

      - name: Connector tests
        run: uv run pytest tests -q

      - name: SaMD verification tests
        run: uv run pytest src/sterilisator_20a/tests -q

      - name: Lint hand-written Python
        run: uvx ruff check certhub/certhub_connector scripts tests src
