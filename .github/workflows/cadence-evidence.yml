name: Cadence evidence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_api_key: ${{ steps.check.outputs.has_api_key }}
    steps:
      - id: check
        env:
          CERTHUB_API_KEY: ${{ secrets.CERTHUB_API_KEY }}
        run: |
          if [ -n "$CERTHUB_API_KEY" ]; then
            echo "has_api_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api_key=false" >> "$GITHUB_OUTPUT"
          fi

  evidence:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.has_api_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install graphviz and PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz default-jre-headless plantuml

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync from CertHub
        env:
          CERTHUB_API_KEY: ${{ secrets.CERTHUB_API_KEY }}
        run: make sync

      - name: Build evidence pack
        run: make evidence

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evidence-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
