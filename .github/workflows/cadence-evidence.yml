name: Cadence evidence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install graphviz and PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz default-jre-headless plantuml

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync from CertHub (when API key is present)
        env:
          CERTHUB_API_KEY: ${{ secrets.CERTHUB_API_KEY }}
        run: |
          if [ -n "$CERTHUB_API_KEY" ]; then
            make sync
          else
            echo "No CERTHUB_API_KEY — building evidence from committed catalog/snapshot"
          fi

      - name: Build evidence pack
        run: make evidence

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evidence-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
